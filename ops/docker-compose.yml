version: '3.8'

services:
  promtail:
    container_name: ops-promtail
    image: grafana/promtail:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    env_file:
      - .env
    restart: always

  jaeger:
    container_name: ops-jaeger
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Query UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    restart: always

  infisical-db:
    container_name: ops-infisical-db
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=${INFISICAL_DB_PASSWORD}
      - POSTGRES_DB=infisical
    volumes:
      - infisical-db-data:/var/lib/postgresql/data
    restart: always

  infisical-redis:
    container_name: ops-infisical-redis
    image: redis:alpine
    restart: always

  infisical:
    container_name: ops-infisical
    image: infisical/infisical:latest
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DB_CONNECTION_URI=postgresql://infisical:${INFISICAL_DB_PASSWORD}@infisical-db:5432/infisical
      - REDIS_URL=redis://infisical-redis:6379
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - AUTH_SECRET=${INFISICAL_AUTH_SECRET}
      - SITE_URL=http://localhost:8080
    depends_on:
      - infisical-db
      - infisical-redis
    restart: always

volumes:
  infisical-db-data:
