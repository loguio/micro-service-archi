apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace(?:_id|Id)":"(\w+)"'
          name: TraceID
          url: '$${__value.raw}'
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
