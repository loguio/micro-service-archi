version: 2
updates:
  # Maintain NPM packages at the root workspace level (manages dependencies of all apps unified under the lockfile)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Maintain base images in auth-service Dockerfile
  - package-ecosystem: "docker"
    directory: "/apps/auth-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Maintain base images in user-service Dockerfile
  - package-ecosystem: "docker"
    directory: "/apps/user-service"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Maintain base images in web-portal Dockerfile
  - package-ecosystem: "docker"
    directory: "/apps/web-portal"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
