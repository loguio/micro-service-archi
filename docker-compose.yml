version: '3.8'

services:
  auth-service:
    container_name: dev-auth-service
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile.dev
    ports:
      - "3001:3001"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/auth-service/node_modules
      - /usr/src/app/apps/auth-service/dist
    environment:
      - NODE_ENV=development
      - PORT=3001

  user-service:
    container_name: dev-user-service
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile.dev
    ports:
      - "3002:3002"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/user-service/node_modules
      - /usr/src/app/apps/user-service/dist
    environment:
      - NODE_ENV=development
      - PORT=3002

  web-portal:
    container_name: dev-web-portal
    build:
      context: .
      dockerfile: apps/web-portal/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/apps/web-portal/node_modules
      - /usr/src/app/apps/web-portal/.next
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - auth-service
      - user-service
